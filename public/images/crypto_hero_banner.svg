<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF5" />
      <stop offset="50%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <!-- Luxury Gold Gradients -->
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="75%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <linearGradient id="goldRim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="35%" stop-color="#FDE68A" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>

    <linearGradient id="ethGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="solGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" />
      <stop offset="50%" stop-color="#DC1FFF" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="rigGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Drop Shadows & Glows -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#B45309" flood-opacity="0.35" />
    </filter>

    <filter id="coinShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#78350F" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="480" height="240" fill="url(#bgGrad)" />

  <!-- Circuit / Hashrate Grid Lines -->
  <g opacity="0.4" stroke="#D97706" stroke-width="1" stroke-dasharray="3,3">
    <line x1="0" y1="40" x2="480" y2="40" />
    <line x1="0" y1="90" x2="480" y2="90" />
    <line x1="0" y1="140" x2="480" y2="140" />
    <line x1="0" y1="190" x2="480" y2="190" />
    <line x1="60" y1="0" x2="60" y2="240" />
    <line x1="140" y1="0" x2="140" y2="240" />
    <line x1="240" y1="0" x2="240" y2="240" />
    <line x1="340" y1="0" x2="340" y2="240" />
    <line x1="420" y1="0" x2="420" y2="240" />
  </g>

  <!-- Blockchain Connection Rays -->
  <g stroke="url(#goldPlate)" stroke-width="2" opacity="0.6">
    <path d="M40,160 L120,110 L190,130 L240,70 L300,120 L370,90 L440,150" fill="none" />
    <circle cx="40" cy="160" r="4" fill="#F59E0B" />
    <circle cx="120" cy="110" r="5" fill="#F59E0B" />
    <circle cx="190" cy="130" r="4" fill="#F59E0B" />
    <circle cx="240" cy="70" r="6" fill="#FBBF24" />
    <circle cx="300" cy="120" r="4" fill="#F59E0B" />
    <circle cx="370" cy="90" r="5" fill="#F59E0B" />
    <circle cx="440" cy="150" r="4" fill="#F59E0B" />
  </g>

  <!-- Ambient Light Auroras -->
  <circle cx="240" cy="100" r="110" fill="#FEF08A" opacity="0.6" filter="url(#goldGlow)" />
  <circle cx="90" cy="90" r="60" fill="#FDE68A" opacity="0.4" />
  <circle cx="390" cy="80" r="60" fill="#FDE68A" opacity="0.4" />

  <!-- BACKGROUND ASIC MINING SERVERS (Left & Right Racks) -->
  <g opacity="0.85">
    <!-- Left Miner Server -->
    <g transform="translate(30, 70)">
      <rect width="90" height="60" rx="8" fill="url(#rigGrad)" filter="url(#softShadow)" stroke="#D4AF37" stroke-width="1.5" />
      <!-- Dual Fans -->
      <circle cx="28" cy="30" r="18" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5" />
      <circle cx="28" cy="30" r="6" fill="#F59E0B" />
      <path d="M28,14 L28,46 M14,30 L42,30 M18,20 L38,40 M18,40 L38,20" stroke="#F59E0B" stroke-width="1.5" opacity="0.6" />
      <circle cx="66" cy="30" r="18" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5" />
      <circle cx="66" cy="30" r="6" fill="#F59E0B" />
      <path d="M66,14 L66,46 M52,30 L80,30 M56,20 L76,40 M56,40 L76,20" stroke="#F59E0B" stroke-width="1.5" opacity="0.6" />
      <!-- Status LEDs -->
      <circle cx="12" cy="10" r="2.5" fill="#10B981" />
      <circle cx="18" cy="10" r="2.5" fill="#10B981" />
      <circle cx="24" cy="10" r="2.5" fill="#3B82F6" />
      <rect x="55" y="7" width="26" height="5" rx="2" fill="#D4AF37" opacity="0.7" />
    </g>

    <!-- Right Miner Server -->
    <g transform="translate(360, 70)">
      <rect width="90" height="60" rx="8" fill="url(#rigGrad)" filter="url(#softShadow)" stroke="#D4AF37" stroke-width="1.5" />
      <!-- Dual Fans -->
      <circle cx="28" cy="30" r="18" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5" />
      <circle cx="28" cy="30" r="6" fill="#F59E0B" />
      <path d="M28,14 L28,46 M14,30 L42,30 M18,20 L38,40 M18,40 L38,20" stroke="#F59E0B" stroke-width="1.5" opacity="0.6" />
      <circle cx="66" cy="30" r="18" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5" />
      <circle cx="66" cy="30" r="6" fill="#F59E0B" />
      <path d="M66,14 L66,46 M52,30 L80,30 M56,20 L76,40 M56,40 L76,20" stroke="#F59E0B" stroke-width="1.5" opacity="0.6" />
      <!-- Status LEDs -->
      <circle cx="12" cy="10" r="2.5" fill="#10B981" />
      <circle cx="18" cy="10" r="2.5" fill="#10B981" />
      <circle cx="24" cy="10" r="2.5" fill="#3B82F6" />
      <rect x="55" y="7" width="26" height="5" rx="2" fill="#D4AF37" opacity="0.7" />
    </g>
  </g>

  <!-- FLOATING CRYPTO COINS -->

  <!-- Left: 3D Ethereum Crystal Diamond -->
  <g transform="translate(95, 45) rotate(-12)" filter="url(#coinShadow)">
    <circle cx="28" cy="28" r="28" fill="url(#goldPlate)" stroke="#FFF" stroke-width="1.5" />
    <circle cx="28" cy="28" r="24" fill="#0F172A" stroke="#D4AF37" stroke-width="1" />
    <!-- ETH Diamond Faces -->
    <g transform="translate(14, 10)">
      <polygon points="14,0 0,22 14,16" fill="#FFFBEB" opacity="0.9" />
      <polygon points="14,0 14,16 28,22" fill="#F59E0B" opacity="0.9" />
      <polygon points="14,18 0,24 14,36" fill="#D97706" opacity="0.95" />
      <polygon points="14,18 14,36 28,24" fill="#B45309" opacity="0.95" />
    </g>
  </g>

  <!-- Far Left: Tether (USDT) Medallion -->
  <g transform="translate(20, 130) rotate(15)" filter="url(#softShadow)">
    <circle cx="20" cy="20" r="18" fill="url(#goldPlate)" stroke="#FFF" stroke-width="1" />
    <circle cx="20" cy="20" r="15" fill="#26A17B" />
    <text x="20" y="26" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="17" fill="#FFFFFF" text-anchor="middle">₮</text>
  </g>

  <!-- Right: Solana (SOL) Gradient Coin -->
  <g transform="translate(355, 45) rotate(14)" filter="url(#coinShadow)">
    <circle cx="28" cy="28" r="28" fill="url(#goldPlate)" stroke="#FFF" stroke-width="1.5" />
    <circle cx="28" cy="28" r="24" fill="#0F172A" stroke="#D4AF37" stroke-width="1" />
    <!-- SOL Logo Wave Bars -->
    <g transform="translate(15, 16)">
      <path d="M0,4 L18,4 L26,0 L8,0 Z" fill="url(#solGrad)" />
      <path d="M8,12 L26,12 L18,16 L0,16 Z" fill="url(#solGrad)" />
      <path d="M0,24 L18,24 L26,20 L8,20 Z" fill="url(#solGrad)" />
    </g>
  </g>

  <!-- Far Right: Binance Coin / Yield Medallion -->
  <g transform="translate(425, 125) rotate(-10)" filter="url(#softShadow)">
    <circle cx="20" cy="20" r="18" fill="url(#goldPlate)" stroke="#FFF" stroke-width="1" />
    <circle cx="20" cy="20" r="15" fill="#F3BA2F" />
    <rect x="15" y="15" width="10" height="10" rx="2" transform="rotate(45 20 20)" fill="#FFFFFF" />
  </g>

  <!-- CENTER MASTERPIECE: 3D 24K GOLD BITCOIN MEDALLION -->
  <g transform="translate(240, 95)" filter="url(#coinShadow)">
    <!-- Outer Glow Halo -->
    <circle cx="0" cy="0" r="62" fill="url(#goldRim)" opacity="0.4" />
    
    <!-- Outer Beveled Gold Rim -->
    <circle cx="0" cy="0" r="55" fill="url(#goldRim)" stroke="#FFFFFF" stroke-width="2" />
    
    <!-- Ribbed Coin Edge Notch Pattern -->
    <circle cx="0" cy="0" r="51" fill="none" stroke="#78350F" stroke-width="3" stroke-dasharray="3,2" />

    <!-- Coin Face Basin -->
    <circle cx="0" cy="0" r="48" fill="url(#goldPlate)" />

    <!-- Inner Inset Groove -->
    <circle cx="0" cy="0" r="41" fill="none" stroke="#FFFBEB" stroke-width="1.5" opacity="0.8" />
    <circle cx="0" cy="0" r="40" fill="url(#goldPlate)" />

    <!-- 3D Embossed Bitcoin Symbol ₿ -->
    <!-- Drop shadow for 3D depth -->
    <path d="M-13,-24 L-3,-24 C3,-24 8,-22 8,-17 C8,-13 6,-11 2,-9 C8,-8 11,-5 11,2 C11,9 5,12 -3,12 L-13,12 Z M-13,-28 L-9,-28 L-9,-24 L-3,-24 L-3,-28 L1,-28 L1,-24 C8,-24 14,-21 14,-14 C14,-9 11,-6 7,-4 C13,-2 17,2 17,9 C17,17 10,21 1,21 L1,26 L-3,26 L-3,21 L-9,21 L-9,26 L-13,26 L-13,21 L-19,21 L-19,16 L-13,16 Z" fill="#78350F" transform="translate(2, 3)" opacity="0.6" />

    <!-- Front 3D Gold Bitcoin Glyph -->
    <g fill="#FFFFFF" filter="url(#goldGlow)">
      <text x="0" y="20" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="54" text-anchor="middle" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5">₿</text>
    </g>
  </g>

  <!-- Sparkles & Stars -->
  <g fill="#FFFFFF" opacity="0.9">
    <!-- Star 1 -->
    <path d="M190,40 Q190,48 182,48 Q190,48 190,56 Q190,48 198,48 Q190,48 190,40 Z" fill="#FFF" />
    <!-- Star 2 -->
    <path d="M305,45 Q305,53 297,53 Q305,53 305,61 Q305,53 313,53 Q305,53 305,45 Z" fill="#FFF" />
    <!-- Star 3 -->
    <path d="M140,165 Q140,171 134,171 Q140,171 140,177 Q140,171 146,171 Q140,171 140,165 Z" fill="#FDE68A" />
    <!-- Star 4 -->
    <path d="M340,160 Q340,166 334,166 Q340,166 340,172 Q340,166 346,166 Q340,166 340,160 Z" fill="#FDE68A" />
  </g>

  <!-- Subtle Floating Hashrate Indicator Pill -->
  <g transform="translate(170, 182)" filter="url(#softShadow)">
    <rect width="140" height="26" rx="13" fill="#FFFFFF" stroke="#D4AF37" stroke-width="1.5" />
    <circle cx="16" cy="13" r="5" fill="#10B981" />
    <circle cx="16" cy="13" r="8" fill="#10B981" opacity="0.25" />
    <text x="75" y="17" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="800" fill="#0F172A" text-anchor="middle">
      1.84 PH/s <tspan fill="#F59E0B">ACTIVE</tspan>
    </text>
  </g>

  <!-- Bottom Arch Curved Divider to blend with card below -->
  <path d="M0,210 Q240,245 480,210 L480,240 L0,240 Z" fill="#F8FAFC" opacity="0.6" />
</svg>

