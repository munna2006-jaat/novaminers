<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="ethOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="30%" stop-color="#FCD34D"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="ethDiamondTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="ethDiamondDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <filter id="glowEth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#D97706" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="90" fill="url(#ethOuter)" filter="url(#glowEth)"/>
  <circle cx="100" cy="100" r="82" fill="#FFFFFF"/>
  <circle cx="100" cy="100" r="76" fill="#F8FAFC"/>
  <!-- Ethereum 3D Facets -->
  <g transform="translate(100, 100) scale(1.1) translate(-100, -100)">
    <polygon points="100,38 62,100 100,82" fill="url(#ethDiamondTop)"/>
    <polygon points="100,38 100,82 138,100" fill="url(#ethDiamondDark)"/>
    <polygon points="100,88 62,106 100,128" fill="url(#ethDiamondTop)"/>
    <polygon points="100,88 100,128 138,106" fill="url(#ethDiamondDark)"/>
    <polygon points="100,134 62,112 100,162" fill="url(#ethDiamondTop)"/>
    <polygon points="100,134 100,162 138,112" fill="url(#ethDiamondDark)"/>
  </g>
</svg>